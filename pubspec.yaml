name: simple_attende
description: Simple Attende – A beautiful attendance tracking application.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  provider: ^6.1.2
  audioplayers: ^6.1.0
  uuid: ^4.4.0
  intl: ^0.19.0
  path_provider: ^2.1.3
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  http: ^1.2.0
  table_calendar: ^3.1.2
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "SimpleAttende_AppIcon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1E1A29"
  adaptive_icon_foreground: "SimpleAttende_AppIcon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/

